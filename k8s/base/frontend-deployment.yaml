apiVersion: apps/v1
kind: Deployment
metadata:
  name: assetflow-frontend
  labels:
    app: assetflow-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: assetflow-frontend
  template:
    metadata:
      labels:
        app: assetflow-frontend
    spec:
      serviceAccountName: default
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          image: ghcr.io/ayshrosine/assetflow-frontend:fixed
          ports:
            - containerPort: 8080
          env:
            - name: REACT_APP_GOOGLE_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: assetflow-config
                  key: GOOGLE_CLIENT_ID
            - name: REACT_APP_BACKEND_URL
              value: "https://assetflow-backend-ayshrosine-dev.apps.rm1.0a51.p1.openshiftapps.com"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
