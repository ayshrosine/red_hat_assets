apiVersion: apps/v1
kind: Deployment
metadata:
  name: assetflow-backend
  labels:
    app: assetflow-backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: assetflow-backend
  template:
    metadata:
      labels:
        app: assetflow-backend
    spec:
      serviceAccountName: assetflow-backend-sa
      containers:
        - name: backend
          image: ghcr.io/ayshrosine/assetflow-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: assetflow-config
            - secretRef:
                name: assetflow-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /startupz
              port: 8000
            failureThreshold: 30
            periodSeconds: 5
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: assetflow-uploads-pvc
